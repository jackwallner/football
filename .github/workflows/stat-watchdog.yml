name: Stat Data Watchdog

# Checks all four StatScout apps from the outside and keeps one issue per stale
# app, closed again once the app catches up. No @mention: Jack hears about stale
# data in the ops digest (fleet-probe runs the same check), not through GitHub. Lives here
# rather than in each app's repo so a repo whose own Actions stop running is
# still watched. The MacBook Pro's fleet-probe runs the same check
# (scripts/stat_freshness.py) and reports to Discord, so one dead runner can't
# silence both.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      simulate_stale:
        description: "Report this app (baseball, football, hockey, basketball) as stale once, to test the alert end to end"
        type: string
        default: ""

concurrency:
  group: stat-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare each app with the games already played
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASEBALL_SUPABASE_URL: ${{ secrets.BASEBALL_SUPABASE_URL }}
          BASEBALL_SUPABASE_ANON_KEY: ${{ secrets.BASEBALL_SUPABASE_ANON_KEY }}
          FOOTBALL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          FOOTBALL_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HOCKEY_SUPABASE_URL: ${{ secrets.HOCKEY_SUPABASE_URL }}
          HOCKEY_SUPABASE_ANON_KEY: ${{ secrets.HOCKEY_SUPABASE_ANON_KEY }}
          BASKETBALL_SUPABASE_URL: ${{ secrets.BASKETBALL_SUPABASE_URL }}
          BASKETBALL_SUPABASE_ANON_KEY: ${{ secrets.BASKETBALL_SUPABASE_ANON_KEY }}
          SIMULATE_STALE: ${{ inputs.simulate_stale }}
        run: python3 scripts/stat_freshness.py --github-issues --simulate-stale "$SIMULATE_STALE"
