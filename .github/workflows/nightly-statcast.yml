name: Nightly NFL Refresh

on:
  schedule:
    # nflverse publishes its data mirror on a weekly cadence (games are once a
    # week per team), unlike Statcast which updates nightly during an MLB
    # season — so one run a night is enough here; there's no second pass to
    # add the way baseball's workflow needed one.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      full_game_log_reingest:
        description: "Re-ingest per-game logs from season start (needed after a metric-set change)"
        type: boolean
        default: false
      backfill_seasons:
        description: "Re-ingest a season range as well, e.g. 2018-2025 (needed after adding a metric source)"
        type: string
        default: ""
      rollup_all_time:
        description: "Rebuild the All Time career rollup (season 0)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # STATCAST_SEASON is passed through empty unless the repo variable is set, and
  # empty is what we want: every script falls back to `resolve_season`, which
  # reads the calendar (year if month >= 9, else year - 1). It used to carry a
  # literal '2025' fallback, which would have quietly pinned the nightly run to
  # the 2025 season forever - come week 1 of 2026 the workflow would still be
  # re-ingesting a finished year and no new data would ever land. Set the repo
  # variable only to force a specific season.

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # The nightly incremental path is quick. A full game-log re-ingest walks
    # the whole season's weekly stats plus the recent-form rollup and needs
    # more headroom. A season backfill plus the career rollup needs far more
    # again: the rollup alone reads every season from 2000 on.
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: PYTHONPATH=backend python -m pytest backend/tests

      - name: Run NFL snapshot ingestion
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
        run: |
          set -o pipefail
          python backend/ingest.py --season-type all 2>&1 | tee ingestion.log

      # Adding a metric source (PFR advanced defence, weekly CPOE) only reaches
      # seasons that are re-ingested, so a range backfill is a manual, explicit
      # step rather than something the nightly path does on its own.
      - name: Backfill season range
        if: inputs.backfill_seasons != ''
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RANGE: ${{ inputs.backfill_seasons }}
        run: |
          set -o pipefail
          FIRST="${RANGE%%-*}"
          LAST="${RANGE##*-}"
          if ! [[ "$FIRST" =~ ^[0-9]{4}$ && "$LAST" =~ ^[0-9]{4}$ ]]; then
            echo "backfill_seasons must look like 2018-2025 (got '$RANGE')" >&2
            exit 1
          fi
          if [ "$FIRST" -gt "$LAST" ]; then
            echo "backfill_seasons range is inverted: $RANGE" >&2
            exit 1
          fi
          for season in $(seq "$FIRST" "$LAST"); do
            echo "::group::Backfilling $season"
            python backend/ingest.py --season "$season" --season-type all 2>&1 | tee -a backfill.log
            echo "::endgroup::"
          done

      - name: Rebuild All Time career rollup
        if: inputs.rollup_all_time
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          python backend/rollup_all_time.py --season-type all 2>&1 | tee all_time.log

      - name: Run per-game ingestion (Recent Form data)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          # A metric-set change only reaches already-ingested games via a full
          # re-ingest; the nightly path stays incremental from the last date.
          FULL_REINGEST: ${{ inputs.full_game_log_reingest }}
        run: |
          set -o pipefail
          if [ "$FULL_REINGEST" = "true" ]; then
            python backend/ingest_game_logs.py --full 2>&1 | tee game_logs_ingestion.log
          else
            python backend/ingest_game_logs.py 2>&1 | tee game_logs_ingestion.log
          fi

      - name: Roll up rolling windows (last 3/5/8 weeks)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
        run: |
          set -o pipefail
          python backend/rollup_recent_form.py 2>&1 | tee recent_form_rollup.log

      # Recent Form is a live-season feature, so the two per-game tables behind
      # it keep one season only. Runs after the rollup, and cuts on the newest
      # season actually present rather than the calendar, so last season's rows
      # survive until the first game of the new one has landed.
      #
      # Skipped on a backfill: a range re-ingest is the one case where older
      # seasons are being written on purpose, and pruning them in the same run
      # would delete the work as it finished.
      - name: Prune per-game history to the live season
        if: inputs.backfill_seasons == ''
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          python backend/prune_history.py 2>&1 | tee prune_history.log

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-failure-logs
          path: |
            backend/tests/
            backend/*.py
            ingestion.log

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly NFL ingestion failed',
              body: ':warning: Nightly NFL ingestion failed, check [run logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            })
