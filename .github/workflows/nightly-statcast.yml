name: Nightly NFL Refresh

on:
  schedule:
    # nflverse publishes its data mirror on a weekly cadence (games are once a
    # week per team), unlike Statcast which updates nightly during an MLB
    # season — so one run a night is enough here; there's no second pass to
    # add the way baseball's workflow needed one.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      full_game_log_reingest:
        description: "Re-ingest per-game logs from season start (needed after a metric-set change)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # The nightly incremental path is quick. A full game-log re-ingest walks
    # the whole season's weekly stats plus the recent-form rollup and needs
    # more headroom.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: PYTHONPATH=backend python -m pytest backend/tests

      - name: Run NFL snapshot ingestion
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON || '2025' }}
        run: |
          set -o pipefail
          python backend/ingest.py --season-type all 2>&1 | tee ingestion.log

      - name: Run per-game ingestion (Recent Form data)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON || '2025' }}
          # A metric-set change only reaches already-ingested games via a full
          # re-ingest; the nightly path stays incremental from the last date.
          FULL_REINGEST: ${{ inputs.full_game_log_reingest }}
        run: |
          set -o pipefail
          if [ "$FULL_REINGEST" = "true" ]; then
            python backend/ingest_game_logs.py --full 2>&1 | tee game_logs_ingestion.log
          else
            python backend/ingest_game_logs.py 2>&1 | tee game_logs_ingestion.log
          fi

      - name: Roll up rolling windows (last 3/5/8 weeks)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON || '2025' }}
        run: |
          set -o pipefail
          python backend/rollup_recent_form.py 2>&1 | tee recent_form_rollup.log

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-failure-logs
          path: |
            backend/tests/
            backend/*.py
            ingestion.log

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly NFL ingestion failed',
              body: ':warning: Nightly NFL ingestion failed, check [run logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            })
