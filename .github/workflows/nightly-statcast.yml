name: Nightly NFL Refresh

on:
  schedule:
    # GitHub schedule dispatch is best effort.  The durable source fingerprint
    # and the daily safety pass make a delayed dispatch converge on the next
    # check.  The first schedule covers the active NFL months; the second is a
    # cheap offseason safety check.
    - cron: "*/30 * * 9-12,1-2 *"
    - cron: "0 10 * 3-8 *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run a full current-season refresh even when source metadata is unchanged"
        type: boolean
        default: false
      full_game_log_reingest:
        description: "Compatibility alias for a full current-season refresh"
        type: boolean
        default: false
      backfill_seasons:
        description: "Re-ingest a season range as well, e.g. 2018-2025 (needed after adding a metric source)"
        type: string
        default: ""
      rollup_all_time:
        description: "Rebuild the All Time career rollup (season 0)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # STATCAST_SEASON is passed through empty unless the repo variable is set.
  # Empty keeps the existing calendar resolver: year if month >= 9, otherwise
  # year - 1.

concurrency:
  group: nfl-data-refresh
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      season: ${{ steps.source-probe.outputs.season }}
      ready: ${{ steps.source-probe.outputs.ready }}
      changed: ${{ steps.source-probe.outputs.changed }}
      refresh_id: ${{ steps.source-probe.outputs.refresh_id }}
      fingerprint: ${{ steps.source-probe.outputs.fingerprint }}
      source_published_at: ${{ steps.source-probe.outputs.source_published_at }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe nflverse source generations
        id: source-probe
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          FORCE_REFRESH: ${{ inputs.force || inputs.full_game_log_reingest || inputs.backfill_seasons != '' || inputs.rollup_all_time }}
        run: |
          set -o pipefail
          args=()
          if [ "$FORCE_REFRESH" = "true" ]; then
            args+=(--force)
          fi
          python backend/source_probe.py --github-output "$GITHUB_OUTPUT" "${args[@]}" 2>&1 | tee source_probe.log

  refresh:
    if: needs.probe.outputs.changed == 'true'
    needs: probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # Full current-season rebuilds are source-complete and still small.  Keep
    # room for an explicit historical backfill or career rollup below.
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: PYTHONPATH=backend python -m pytest backend/tests

      - name: Build and atomically publish current season
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATCAST_SEASON: ${{ vars.STATCAST_SEASON }}
          REFRESH_ID: ${{ needs.probe.outputs.refresh_id }}
          SEASON: ${{ needs.probe.outputs.season }}
        run: |
          set -o pipefail
          python backend/refresh.py --refresh-id "$REFRESH_ID" --season "$SEASON" 2>&1 | tee refresh.log

      # Adding a metric source only reaches seasons explicitly requested.  The
      # event path above remains current-season only and does not rewrite the
      # historical bundle or career rollup on every probe.
      - name: Backfill season range
        if: inputs.backfill_seasons != ''
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RANGE: ${{ inputs.backfill_seasons }}
        run: |
          set -o pipefail
          FIRST="${RANGE%%-*}"
          LAST="${RANGE##*-}"
          if ! [[ "$FIRST" =~ ^[0-9]{4}$ && "$LAST" =~ ^[0-9]{4}$ ]]; then
            echo "backfill_seasons must look like 2018-2025 (got '$RANGE')" >&2
            exit 1
          fi
          if [ "$FIRST" -gt "$LAST" ]; then
            echo "backfill_seasons range is inverted: $RANGE" >&2
            exit 1
          fi
          for season in $(seq "$FIRST" "$LAST"); do
            echo "::group::Backfilling $season"
            python backend/ingest.py --season "$season" --season-type all 2>&1 | tee -a backfill.log
            echo "::endgroup::"
          done

      - name: Rebuild All Time career rollup
        if: inputs.rollup_all_time
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          python backend/rollup_all_time.py --season-type all 2>&1 | tee all_time.log

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-failure-logs
          path: |
            backend/tests/
            backend/*.py
            source_probe.log
            refresh.log
            backfill.log
            all_time.log

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'NFL data refresh failed',
              body: ':warning: NFL data refresh failed, check [run logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            })
