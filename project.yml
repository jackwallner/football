name: StatScout
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.72.0
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  lastUpgradeCheck: "1600"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  StatScout:
    type: application
    platform: iOS
    sources:
      - path: StatScout
        excludes:
          - Data/*.json
    resources:
      - StatScout/PrivacyInfo.xcprivacy
      - StatScout/Data/players-historical.plist
      - StatScout/Data/players-current.plist
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.football
        PRODUCT_NAME: "Gridiron StatScout"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "17"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StatScout/Info.plist
        CODE_SIGN_ENTITLEMENTS: StatScout/StatScout.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          SUPABASE_URL: $(SUPABASE_URL)
          SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(PROVISIONING_PROFILE_SPECIFIER)
          SUPABASE_URL: $(SUPABASE_URL)
          SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    preBuildScripts:
      - name: Pre-build validation
        basedOnDependencyAnalysis: false
        script: |
          if ! command -v xcodegen &> /dev/null; then
            echo "warning: xcodegen not found. Install via 'brew install xcodegen'."
          fi
          if [ "$PLATFORM_NAME" != "iphonesimulator" ]; then
            if [ -z "$SUPABASE_URL" ]; then
              echo "error: SUPABASE_URL not set."
              exit 1
            fi
            if [ -z "$SUPABASE_ANON_KEY" ]; then
              echo "error: SUPABASE_ANON_KEY not set."
              exit 1
            fi
          fi
    entitlements:
      path: StatScout/StatScout.entitlements
    dependencies:
      - package: RevenueCat
      - sdk: XCTest.framework
        weak: true

  StatScoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StatScoutTests
    dependencies:
      - target: StatScout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gridiron StatScout.app/Gridiron StatScout"

  StatScoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StatScoutUITests
    dependencies:
      - target: StatScout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StatScout

schemes:
  StatScout:
    build:
      targets:
        StatScout: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StatScoutTests
        - StatScoutUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
